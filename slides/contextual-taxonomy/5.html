<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomy = Future-Proof AI Ads</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #262b32;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f3f3f3;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            min-height: 800px;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5vh 5vw;
            box-sizing: border-box;
        }

        .title {
            text-align: center;
            font-size: clamp(48px, 8vw, 84px);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: clamp(60px, 10vh, 120px);
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .title .taxonomy {
            color: rgb(63,193,201);
        }

        .title .equals {
            color: #f3f3f3;
        }

        .title .future {
            color: #fc5185;
        }

        .title .proof {
            color: #fc5185;
        }

        .title .ai {
            color: rgb(63,193,201);
        }

        .title .ads {
            color: rgb(63,193,201);
        }

        .visual-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: clamp(60px, 10vh, 120px);
            width: 100%;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(25px, 4vh, 35px);
            width: 100%;
            max-width: clamp(400px, 50vw, 600px);
            opacity: 1;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            background: linear-gradient(135deg, rgba(63,193,201, 0.15), rgba(63,193,201, 0.05));
            border: 3px solid rgb(63,193,201);
            border-radius: clamp(20px, 2.5vw, 28px);
            padding: clamp(20px, 3vw, 30px) clamp(25px, 4vw, 40px);
            box-shadow: 0 12px 48px rgba(63,193,201, 0.3);
            backdrop-filter: blur(10px);
            animation: checklistSlide 0.8s ease-out forwards;
            opacity: 1;
            transform: translateX(0);
            position: relative;
            overflow: hidden;
        }

        .checklist-item:nth-child(1) { animation-delay: 0.2s; }
        .checklist-item:nth-child(2) { animation-delay: 0.4s; }
        .checklist-item:nth-child(3) { animation-delay: 0.6s; }
        .checklist-item:nth-child(4) { animation-delay: 0.8s; }

        .checklist-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(252, 81, 133, 0.1), transparent);
            animation: progressFill 2s ease-out forwards;
            animation-delay: calc(var(--delay) + 0.8s);
        }

        .checklist-item:nth-child(1)::before { --delay: 0.2s; }
        .checklist-item:nth-child(2)::before { --delay: 0.4s; }
        .checklist-item:nth-child(3)::before { --delay: 0.6s; }
        .checklist-item:nth-child(4)::before { --delay: 0.8s; }

        .check-icon {
            font-size: clamp(36px, 5vw, 48px);
            color: #fc5185;
            margin-right: clamp(20px, 3vw, 30px);
            animation: checkBounce 0.6s ease-out forwards;
            animation-delay: 0.5s;
            transform: scale(1);
            text-shadow: 0 0 20px rgba(252, 81, 133, 0.5);
        }

        .checklist-item:nth-child(1) .check-icon { --check-delay: 0.2s; }
        .checklist-item:nth-child(2) .check-icon { --check-delay: 0.4s; }
        .checklist-item:nth-child(3) .check-icon { --check-delay: 0.6s; }
        .checklist-item:nth-child(4) .check-icon { --check-delay: 0.8s; }

        .check-label {
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 800;
            color: rgb(63,193,201);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
        }

        .completion-badge {
            position: absolute;
            top: clamp(-30px, -4vh, -40px);
            right: clamp(20px, 3vw, 30px);
            background: linear-gradient(135deg, #fc5185, rgba(252, 81, 133, 0.8));
            border: 2px solid #fc5185;
            border-radius: clamp(16px, 2vw, 20px);
            padding: clamp(8px, 1vw, 12px) clamp(15px, 2vw, 20px);
            font-size: clamp(12px, 1.5vw, 14px);
            font-weight: 700;
            color: #f3f3f3;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 32px rgba(252, 81, 133, 0.4);
            animation: badgeAppear 0.8s ease-out forwards;
            animation-delay: 1s;
            opacity: 1;
            transform: scale(1) rotate(-3deg);
        }

        .overlay-caption {
            text-align: center;
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(45deg, rgb(63,193,201), #fc5185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: captionGlow 2s ease-in-out infinite;
            animation-delay: 2.5s;
        }

        @keyframes checklistSlide {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes checkBounce {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes badgeAppear {
            0% { opacity: 0; transform: scale(0.8) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(-3deg); }
        }

        @keyframes captionGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2) drop-shadow(0 0 20px rgba(63,193,201, 0.3)); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .checklist-item {
                flex-direction: column;
                text-align: center;
                gap: clamp(15px, 2vh, 20px);
            }
            
            .check-icon {
                margin-right: 0;
                margin-bottom: clamp(10px, 1.5vh, 15px);
            }
            
            .completion-badge {
                position: static;
                margin-top: clamp(20px, 3vh, 30px);
                transform: rotate(0deg);
                align-self: center;
            }
        }

        /* Success pulse animation for completed items */
        @keyframes successPulse {
            0%, 100% { box-shadow: 0 12px 48px rgba(63,193,201, 0.3); }
            50% { box-shadow: 0 16px 64px rgba(252, 81, 133, 0.4); }
        }

        .checklist-item.completed {
            animation: successPulse 3s ease-in-out infinite;
            animation-delay: 2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <span class="taxonomy">taxonomy</span> <span class="equals">=</span><br>
            <span class="future">future-proof</span><br>
            <span class="ai">AI</span> <span class="ads">ads</span>
        </div>

        <div class="visual-section">
            <div class="checklist-container">
                <div class="checklist-item completed">
                    <div class="check-icon">✓</div>
                    <div class="check-label">relevance</div>
                </div>
                
                <div class="checklist-item completed">
                    <div class="check-icon">✓</div>
                    <div class="check-label">safety</div>
                </div>
                
                <div class="checklist-item completed">
                    <div class="check-icon">✓</div>
                    <div class="check-label">scale</div>
                </div>
                
                <div class="checklist-item completed">
                    <div class="check-icon">✓</div>
                    <div class="check-label">comparability</div>
                </div>
                
                <div class="completion-badge">✨ complete</div>
            </div>
        </div>

        <div class="overlay-caption">
            future-proof your campaigns
        </div>
    </div>
</body>
</html>
