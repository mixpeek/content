<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Playbook for RFP Decks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide {
            width: 1920px;
            height: 1080px;
            background: rgba(38, 43, 50, 1);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            position: relative;
            overflow: hidden;
        }
        
        .title {
            font-size: 4rem;
            font-weight: 700;
            color: #f3f3f3;
            text-align: center;
            margin-bottom: 100px;
            letter-spacing: -0.02em;
        }
        
        .emoji {
            font-size: 4.5rem;
            margin-right: 24px;
        }
        
        .blocks-container {
            display: flex;
            gap: 60px;
            width: 100%;
            max-width: 1600px;
            justify-content: center;
        }
        
        .block {
            flex: 1;
            background: rgba(45, 52, 60, 0.8);
            border-radius: 32px;
            padding: 60px 40px;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .block:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        
        .block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            border-radius: 32px 32px 0 0;
        }
        
        .block:nth-child(1)::before {
            background: #fc5185;
        }
        
        .block:nth-child(2)::before {
            background: rgb(63, 193, 201);
        }
        
        .block:nth-child(3)::before {
            background: #808080;
        }
        
        .block-icon {
            font-size: 5rem;
            margin-bottom: 32px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        
        .block-title {
            font-size: 2rem;
            font-weight: 600;
            color: #f3f3f3;
            margin-bottom: 24px;
            line-height: 1.2;
        }
        
        .block-description {
            font-size: 1.3rem;
            color: #a0a0a0;
            line-height: 1.5;
            font-weight: 400;
        }
        
        /* Subtle background pattern */
        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 20%, rgba(252, 81, 133, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(63, 193, 201, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Responsive adjustments for smaller screens */
        @media (max-width: 1600px) {
            .slide {
                width: 100vw;
                height: 100vh;
                padding: 60px;
            }
            
            .title {
                font-size: 3rem;
                margin-bottom: 80px;
            }
            
            .blocks-container {
                gap: 40px;
            }
            
            .block {
                padding: 40px 30px;
                min-height: 350px;
            }
            
            .block-icon {
                font-size: 4rem;
            }
            
            .block-title {
                font-size: 1.6rem;
            }
            
            .block-description {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 1024px) {
            .blocks-container {
                flex-direction: column;
                max-width: 600px;
            }
            
            .block {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <h1 class="title">
            <span class="emoji">📑</span>The Playbook for RFP Decks
        </h1>
        
        <div class="blocks-container">
            <div class="block">
                <div class="block-icon">🎯</div>
                <h2 class="block-title">Contextual Relevance Metrics</h2>
                <p class="block-description">Show ads align with the content & moment.</p>
            </div>
            
            <div class="block">
                <div class="block-icon">🛡️</div>
                <h2 class="block-title">Brand Safety & Suitability</h2>
                <p class="block-description">Guarantee ads avoid risky placements.</p>
            </div>
            
            <div class="block">
                <div class="block-icon">🔮</div>
                <h2 class="block-title">Future-Proof Strategy</h2>
                <p class="block-description">Works without cookies or personal IDs.</p>
            </div>
        </div>
    </div>
</body>
</html>
