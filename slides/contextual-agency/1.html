<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFP Strategy Hook</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide {
            width: 1920px;
            height: 1080px;
            background: rgba(38, 43, 50, 1);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            position: relative;
            overflow: hidden;
        }
        
        .template-container {
            background: rgba(45, 52, 60, 0.9);
            border-radius: 24px;
            padding: 60px;
            width: 100%;
            max-width: 1400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        .template-header {
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 30px;
            margin-bottom: 50px;
        }
        
        .template-title {
            font-size: 2.5rem;
            font-weight: 600;
            color: #f3f3f3;
            margin-bottom: 12px;
        }
        
        .template-subtitle {
            font-size: 1.3rem;
            color: #a0a0a0;
            font-weight: 400;
        }
        
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        
        .old-approach {
            background: rgba(252, 81, 133, 0.1);
            border: 2px solid rgba(252, 81, 133, 0.3);
            border-radius: 16px;
            padding: 40px;
            position: relative;
        }
        
        .old-approach::before {
            content: '❌';
            position: absolute;
            top: -15px;
            left: 30px;
            background: rgba(38, 43, 50, 1);
            padding: 0 15px;
            font-size: 1.5rem;
        }
        
        .old-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fc5185;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .old-text {
            font-size: 1.6rem;
            color: #f3f3f3;
            line-height: 1.4;
            text-decoration: line-through;
            opacity: 0.7;
        }
        
        .new-approach {
            background: rgba(63, 193, 201, 0.1);
            border: 2px solid rgba(63, 193, 201, 0.3);
            border-radius: 16px;
            padding: 40px;
            position: relative;
        }
        
        .new-approach::before {
            content: '✨';
            position: absolute;
            top: -15px;
            left: 30px;
            background: rgba(38, 43, 50, 1);
            padding: 0 15px;
            font-size: 1.5rem;
        }
        
        .new-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgb(63, 193, 201);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .new-text {
            font-size: 1.8rem;
            color: #f3f3f3;
            line-height: 1.4;
            font-weight: 500;
        }
        
        .highlight {
            background: linear-gradient(120deg, rgba(63, 193, 201, 0.3) 0%, rgba(252, 81, 133, 0.3) 100%);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        
        .arrow {
            text-align: center;
            font-size: 3rem;
            color: rgb(63, 193, 201);
            margin: 20px 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.7; transform: translateY(-5px); }
        }
        
        /* Subtle background pattern */
        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 20%, rgba(252, 81, 133, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(63, 193, 201, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1600px) {
            .slide {
                width: 100vw;
                height: 100vh;
                padding: 60px;
            }
            
            .template-title {
                font-size: 2rem;
            }
            
            .old-text, .new-text {
                font-size: 1.4rem;
            }
        }
        
        @media (max-width: 1024px) {
            .template-container {
                padding: 40px;
            }
            
            .old-text, .new-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="template-container">
            <div class="template-header">
                <h1 class="template-title">Strategy Section</h1>
                <p class="template-subtitle">RFP Response Template</p>
            </div>
            
            <div class="content-area">
                <div class="old-approach">
                    <div class="old-label">Don't Pitch This</div>
                    <p class="old-text">We reach 2.5M users aged 18-34 across premium inventory...</p>
                </div>
                
                <div class="arrow">↓</div>
                
                <div class="new-approach">
                    <div class="new-label">Pitch This Instead</div>
                    <p class="new-text">We deliver ads at the moment of <span class="highlight">context</span> when your audience is most engaged.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
