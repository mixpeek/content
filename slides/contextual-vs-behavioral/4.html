<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Contextual to Win RFPs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #262b32;
            color: #f3f3f3;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .title {
            text-align: center;
            padding: 50px 0 80px;
            font-size: 3.8rem;
            font-weight: 800;
            text-transform: lowercase;
            letter-spacing: -0.02em;
            font-style: italic;
            color: #f3f3f3;
        }
        
        .checklist-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
            padding: 40px;
        }
        
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(243, 243, 243, 0.05);
            padding: 40px 60px;
            border-radius: 25px;
            border: 2px solid rgba(243, 243, 243, 0.1);
            min-width: 700px;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .checklist-item:nth-child(1) { animation-delay: 0.2s; }
        .checklist-item:nth-child(2) { animation-delay: 0.4s; }
        .checklist-item:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .checklist-item:hover {
            transform: scale(1.03);
            background: rgba(243, 243, 243, 0.08);
            border-color: rgba(243, 243, 243, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .checkmark {
            font-size: 4rem;
            color: #4ade80;
            animation: checkPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.5));
        }
        
        @keyframes checkPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .checklist-text {
            font-size: 2.2rem;
            font-weight: 600;
            color: #f3f3f3;
            text-transform: lowercase;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        
        .privacy-text { 
            background: linear-gradient(135deg, #f3f3f3, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .brand-text { 
            background: linear-gradient(135deg, #f3f3f3, #d0d0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .future-text { 
            background: linear-gradient(135deg, #f3f3f3, #c0c0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 25px 50px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(243, 243, 243, 0.2);
            animation: overlayGlow 3s ease-in-out infinite;
        }
        
        @keyframes overlayGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(243, 243, 243, 0.1); }
            50% { box-shadow: 0 0 50px rgba(243, 243, 243, 0.2); }
        }
        
        .overlay-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f3f3f3;
            font-family: 'Roboto Mono', monospace;
            text-transform: lowercase;
        }
        
        .equals {
            color: #888;
            margin: 0 15px;
        }
        
        .trust {
            color: #4ade80;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.3));
        }
        
        .roi {
            color: #60a5fa;
            filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.3));
        }
        
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-element {
            position: absolute;
            color: rgba(243, 243, 243, 0.1);
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }
        
        .floating-element:nth-child(3) {
            top: 80%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        @media (max-width: 1024px) {
            .title { font-size: 3rem; padding: 40px 0 60px; }
            .checklist-item { 
                min-width: 600px; 
                padding: 35px 45px;
                gap: 25px;
            }
            .checklist-text { font-size: 1.8rem; }
            .checkmark { font-size: 3.5rem; }
            .overlay-text { font-size: 1.8rem; }
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.2rem; padding: 30px 0 40px; }
            .checklist-item { 
                min-width: 500px; 
                padding: 25px 35px;
                gap: 20px;
            }
            .checklist-text { font-size: 1.5rem; }
            .checkmark { font-size: 3rem; }
            .overlay-text { font-size: 1.4rem; }
        }
        
        @media (max-width: 640px) {
            .checklist-item { 
                min-width: 90vw; 
                padding: 20px 25px;
            }
            .checklist-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-element">📊</div>
        <div class="floating-element">🎯</div>
        <div class="floating-element">🚀</div>
    </div>
    
    <div class="title">
        use contextual to win rfps
    </div>
    
    <div class="checklist-container">
        <div class="checklist-item">
            <div class="checkmark">✔️</div>
            <div class="checklist-text privacy-text">privacy-first pitches</div>
        </div>
        
        <div class="checklist-item">
            <div class="checkmark">✔️</div>
            <div class="checklist-text brand-text">brand safety & suitability</div>
        </div>
        
        <div class="checklist-item">
            <div class="checkmark">✔️</div>
            <div class="checklist-text future-text">cookieless future</div>
        </div>
    </div>
    
    <div class="overlay">
        <div class="overlay-text">
            contextual <span class="equals">=</span> <span class="trust">trust</span> <span class="equals">+</span> <span class="roi">roi</span>
        </div>
    </div>
</body>
</html>
